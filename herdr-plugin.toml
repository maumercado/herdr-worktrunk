id = "maumercado.worktrunk"
name = "Worktrunk"
version = "0.1.0"
# 0.9.2: `worktree open` stopped taking over the repo's own workspace.
min_herdr_version = "0.9.2"
description = "Create, open and remove git worktrees with Worktrunk (wt), and show PR or dirty state on each Space"
platforms = ["linux", "macos"]

# Live status: a watcher that follows Herdr events and git changes, and keeps
# sidebar tokens current until the server stops. It also re-applies tokens after
# a server start (Herdr does not persist them). With "live": false in config.json
# it runs one sync and exits.
[[startup]]
command = ["node", "src/main.mjs", "live"]

# ---------------------------------------------------------------- actions

[[actions]]
id = "picker"
title = "Worktrees: browse, open, create, remove"
contexts = ["workspace"]
command = ["node", "src/main.mjs", "open-pane", "browse"]

[[actions]]
id = "new"
title = "Worktrees: new worktree"
contexts = ["workspace"]
command = ["node", "src/main.mjs", "open-pane", "create"]

[[actions]]
id = "remove"
title = "Worktrees: remove the current worktree"
contexts = ["workspace"]
command = ["node", "src/main.mjs", "open-pane", "remove-current"]

[[actions]]
id = "refresh"
title = "Worktrees: refresh PR and branch status"
contexts = ["workspace"]
command = ["node", "src/main.mjs", "sync", "--force"]

# Target of the GitHub PR link handler below.
[[actions]]
id = "pr-link"
title = "Worktrees: open PR link in a worktree"
contexts = ["workspace"]
command = ["node", "src/main.mjs", "open-pane", "pr-link"]

# ---------------------------------------------------------------- panes

[[panes]]
id = "picker"
title = "Worktrees"
placement = "popup"
width = "85%"
height = "75%"
command = ["node", "src/main.mjs", "picker"]

# ---------------------------------------------------------------- events
# Fallback for when the live watcher is not running: a throttled sync per event.
# While the watcher runs these return at once.

[[events]]
on = "workspace.focused"
command = ["node", "src/main.mjs", "sync"]

[[events]]
on = "workspace.created"
command = ["node", "src/main.mjs", "sync"]

[[events]]
on = "worktree.created"
command = ["node", "src/main.mjs", "sync"]

[[events]]
on = "worktree.opened"
command = ["node", "src/main.mjs", "sync"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "src/main.mjs", "sync"]

# ---------------------------------------------------------------- links
# Ctrl-click a GitHub PR link to open (or create) a worktree for it.

[[link_handlers]]
id = "github-pr"
title = "Open PR in a worktree"
pattern = "^https://github\\.com/[^/]+/[^/]+/pull/[0-9]+"
action = "pr-link"
